# Netlify: STATIC, READ-ONLY SHOWCASE of the platform (no server function, no Python, no order).
# The API responses are pre-computed by the real Python engine and committed in showcase/data/
# (regenerate with `pnpm showcase:data`). The full platform runs locally — see README.md.

[build]
  command = "pnpm run build:showcase"
  publish = "dist/spa"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route (/bot-analysis, /research, …) is served by index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
